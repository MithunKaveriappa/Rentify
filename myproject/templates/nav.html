<nav style="background-color: #1e1e2f; color: white; padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">

  <!-- Project Logo / Home -->
  <div class="logo">
    <a href="{% url 'dashboard' %}" style="text-decoration: none; color: #00bcd4; font-size: 22px; font-weight: bold;">
      RENTIFY
    </a>
  </div>

  <!-- Navigation Links -->
  <div class="nav-links" style="display: flex; gap: 12px; align-items: center;">
    {% if request.user.is_authenticated %}
      <!-- Common links for logged-in users -->
      <a href="{% url 'dashboard' %}">
        <button style="padding: 6px 12px; border: none; background: #00bcd4; color: white; border-radius: 5px; cursor: pointer;">Home</button>
      </a>
      <a href="{% url 'profile_view' %}">
        <button style="padding: 6px 12px; border: none; background: #00bcd4; color: white; border-radius: 5px; cursor: pointer;">Profile</button>
      </a>
      <a href="{% url 'my_items' %}">
        <button style="padding: 6px 12px; border: none; background: #00bcd4; color: white; border-radius: 5px; cursor: pointer;">My Items</button>
      </a>
      <a href="{% url 'wishlist' %}">
        <button style="padding: 6px 12px; border: none; background: #00bcd4; color: white; border-radius: 5px; cursor: pointer;">Wishlist</button>
      </a>
      <a href="{% url 'my_notifications' %}">
        <button style="padding: 6px 12px; border: none; background: #00bcd4; color: white; border-radius: 5px; cursor: pointer;">Notifications</button>
      </a>
      <a href="{% url 'my_requests' %}">
        <button style="padding: 6px 12px; border: none; background: #00bcd4; color: white; border-radius: 5px; cursor: pointer;">My Requests</button>
      </a>
      
      {% if request.user.is_staff %}
        <a href="{% url 'admin:index' %}">
          <button style="padding: 6px 12px; border: none; background: #ff7043; color: white; border-radius: 5px; cursor: pointer;">Admin Panel</button>
        </a>
      {% endif %}
      <a href="{% url 'signout' %}">
        <button style="padding: 6px 12px; border: none; background: #f44336; color: white; border-radius: 5px; cursor: pointer;">Logout</button>
      </a>
    {% else %}
      <!-- Guest / Not logged in -->
      <a href="{% url 'signup' %}">
        <button style="padding: 6px 12px; border: none; background: #4caf50; color: white; border-radius: 5px; cursor: pointer;">Register</button>
      </a>
      <a href="{% url 'signin' %}">
        <button style="padding: 6px 12px; border: none; background: #00bcd4; color: white; border-radius: 5px; cursor: pointer;">User Login</button>
      </a>
      <a href="{% url 'admin:index' %}">
        <button style="padding: 6px 12px; border: none; background: #ff7043; color: white; border-radius: 5px; cursor: pointer;">Admin Login</button>
      </a>
    {% endif %}
  </div>
</nav>
